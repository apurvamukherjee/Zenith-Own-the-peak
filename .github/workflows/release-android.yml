name: Release Android APK

# Push a version tag (git tag v1.5.0 && git push origin v1.5.0) to build a
# signed release APK and publish it as a GitHub Release. The tag must match
# versionName in android/app/build.gradle and package.json. Release notes
# come from docs/release-notes/v1.5.0.md if it exists, else the matching
# "## [1.5.0]" section of CHANGELOG.md.
#
# The APK is signed with the same key as every earlier release, so it
# installs over them and keeps the user's data. Setup: docs/RELEASING.md.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v1.5.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Check signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_B64" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$STORE_PW" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$KEY_PW" ] || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. See docs/RELEASING.md."
            exit 1
          fi

      - name: Check tag, version and changelog agree
        run: |
          version="${TAG#v}"
          gradle_version=$(sed -n 's/^ *versionName "\(.*\)"/\1/p' android/app/build.gradle)
          pkg_version=$(node -p "require('./package.json').version")
          echo "tag=$version gradle=$gradle_version package.json=$pkg_version"
          if [ "$version" != "$gradle_version" ] || [ "$version" != "$pkg_version" ]; then
            echo "::error::Tag $TAG doesn't match versionName ($gradle_version) and package.json ($pkg_version). Bump both, then tag."
            exit 1
          fi
          # Release notes: docs/release-notes/<tag>.md if you wrote one,
          # else this version's CHANGELOG section without its heading.
          if [ -f "docs/release-notes/$TAG.md" ]; then
            cp "docs/release-notes/$TAG.md" "$RUNNER_TEMP/notes.md"
            # The workflow appends its own install line.
            sed -i '/^Install: download/d' "$RUNNER_TEMP/notes.md"
          else
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          fi
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::No release notes: add docs/release-notes/$TAG.md or a '## [$version]' section to CHANGELOG.md."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install, test, build web
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Write signing config
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          # Read by android/app/build.gradle (signingConfigs.release).
          # Gitignored; lives only for this job.
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PW"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PW"
          } > android/keystore.properties

      - name: Build signed APK
        run: |
          npx cap sync android
          cd android && ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify signature
        env:
          EXPECTED_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          # Optional guard: refuse to publish an APK signed with a different
          # key than earlier releases (it wouldn't install over them).
          if [ -n "$EXPECTED_SHA256" ]; then
            got=$(sed -n 's/.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/certs.txt" | head -1 | tr -d ': ' | tr 'A-F' 'a-f')
            want=$(echo "$EXPECTED_SHA256" | tr -d ': ' | tr 'A-F' 'a-f')
            if [ "$got" != "$want" ]; then
              echo "::error::Signing certificate $got doesn't match ANDROID_CERT_SHA256."
              exit 1
            fi
            echo "Signing certificate matches ANDROID_CERT_SHA256."
          fi
          mkdir -p out && cp "$apk" "out/Zenith-$TAG.apk"
          (cd out && sha256sum "Zenith-$TAG.apk" > "Zenith-$TAG.apk.sha256")
          printf '\nInstall: download `Zenith-%s.apk` on your phone and open it. It installs over earlier versions and keeps your data.\n' "$TAG" >> "$RUNNER_TEMP/notes.md"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --verify-tag \
              --title "Zenith $TAG — Android" --notes-file "$RUNNER_TEMP/notes.md"
          fi

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" android/keystore.properties
